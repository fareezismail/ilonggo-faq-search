<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>iLonggo FAQ Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --bg:#fff9e6;
    --surface:#ffffff;
    --surface-2:#fff6cc;
    --ink:#141414;
    --ink-2:#3d3a2a;
    --muted:#6f6a52;
    --line:#e7dcb2;
    --line-strong:#c9b96a;
    --gold:#fdc50e;
    --gold-bright:#ffc700;
    --gold-soft:#fff0b5;
    --gold-ink:#7a5c00;
    --red:#d1130f;
    --mark-bg:#ffe27a;
    --mark-ink:#3d2f00;
    --shadow:0 1px 2px rgba(90,70,0,.07),0 4px 14px rgba(90,70,0,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.55;
  }
  button,select,input:not([type="checkbox"],[type="radio"]){min-height:2.75rem}
  a{color:var(--gold-ink)}
  .wrap{max-width:62rem;margin:0 auto;padding:0 1rem 3rem}
  .brandbar{height:.45rem;background:var(--gold);border-bottom:3px solid var(--red)}

  /* Header */
  header.site{padding:1.75rem 0 0}
  .firm{font-size:.85rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#000;margin:0 0 .35rem;text-align:center}
  h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(2rem,5vw,2.8rem);line-height:1.12;margin:0 0 .6rem;font-weight:700}
  .lede{font-size:1.05rem;color:var(--ink-2);max-width:44rem;margin:0 0 .5rem}
  .lede strong{color:var(--ink)}
  .stats{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;font-size:.875rem;color:var(--muted);margin:.9rem 0 0;padding:.7rem 0 0;border-top:1px solid var(--line)}
  .stats b{color:var(--ink);font-weight:700}

  /* Search panel */
  .panel{padding:1.25rem 0 0}
  .searchbox{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:1rem;
  }
  form.search{display:flex;gap:.6rem}
  .search-field{flex:1;position:relative}
  .search-field svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
  #q{
    width:100%;font:inherit;font-size:1.1rem;padding:.8rem 2.6rem .8rem 2.7rem;
    border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);
    min-height:3.4rem;
  }
  #q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
  #q:focus{outline:3px solid var(--gold-soft);border-color:var(--gold-ink)}
  #q::placeholder{color:var(--muted)}
  .clear-btn{
    position:absolute;right:.35rem;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.25rem;line-height:1;
    width:2.5rem;height:2.5rem;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0;min-height:2.5rem;
  }
  .clear-btn:hover{background:var(--surface-2);color:var(--ink)}
  .clear-btn.show{display:flex}
  .go-btn{
    font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;border:0;border-radius:8px;
    background:#000;color:#fff;padding:.8rem 1.5rem;min-height:3.4rem;
  }
  .go-btn:hover{background:#2b2b2b}

  /* Category filter */
  .type-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.9rem}
  .type-row label{font-size:.9rem;font-weight:700;color:var(--ink-2)}
  #cat-filter{
    font:inherit;font-size:.95rem;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line-strong);border-radius:8px;
    padding:.55rem .7rem;min-height:2.75rem;max-width:100%;cursor:pointer;
  }
  #cat-filter:focus{outline:3px solid var(--gold-soft);border-color:var(--gold-ink)}

  /* Result meta */
  .meta{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:baseline;margin:1.1rem 0 .2rem;min-height:1.6rem}
  .meta .count{font-weight:700;font-size:1rem}
  .meta .detail{color:var(--muted);font-size:.9rem}

  /* Results */
  .results{display:flex;flex-direction:column;gap:.7rem;margin-top:.6rem}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    padding:.95rem 1.05rem 1rem;
  }
  .card-top{display:flex;flex-wrap:wrap;gap:.45rem .7rem;align-items:center;margin-bottom:.45rem}
  .badge{
    font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink);
    display:inline-flex;align-items:center;gap:.4rem;
  }
  .dot{width:.55rem;height:.55rem;border-radius:50%;flex:none;background:var(--gold);border:1px solid var(--line-strong)}
  .section-name{font-size:.8rem;font-weight:600;color:var(--muted)}
  .question{font-size:1.06rem;font-weight:700;line-height:1.4;margin:0 0 .5rem;overflow-wrap:break-word}
  .answer{font-size:.97rem;color:var(--ink);overflow-wrap:break-word}
  .answer p{margin:0 0 .55rem}
  .answer p:last-child{margin-bottom:0}
  .answer a{font-weight:600}
  mark{background:var(--mark-bg);color:var(--mark-ink);border-radius:2px;padding:0 .08em}
  .card-foot{margin-top:.75rem;padding-top:.6rem;border-top:1px solid var(--line);font-size:.85rem}
  .card-foot a{font-weight:600;text-decoration:none}
  .card-foot a:hover{text-decoration:underline}
  .more-row{display:flex;justify-content:center;margin-top:1rem}
  .more-btn{
    font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);border-radius:8px;padding:.6rem 1.4rem;min-height:2.9rem;
  }
  .more-btn:hover{border-color:var(--gold-ink)}

  /* Empty / no-results states */
  .state{
    background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;
    padding:1.4rem 1.25rem;margin-top:.6rem;
  }
  .state h2{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;margin:0 0 .45rem}
  .state p{color:var(--ink-2);margin:0 0 .8rem;max-width:40rem}
  .index-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:.7rem;margin-top:1rem}
  .index-card{border:1px solid var(--line);border-radius:10px;padding:.85rem .95rem;background:var(--surface-2);cursor:pointer;text-align:left;font:inherit;width:100%}
  .index-card:hover{border-color:var(--gold-ink)}
  .index-card h3{margin:0 0 .3rem;font-size:.95rem;display:flex;align-items:center;gap:.45rem}
  .index-card p{margin:0;font-size:.87rem;color:var(--ink-2)}
  .index-card .n{font-size:.78rem;color:var(--muted);font-weight:600}

  footer.site{
    margin-top:2.6rem;border-top:1px solid var(--line);padding-top:1rem;
    font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;
  }
  .hidden{display:none !important}
  @media (max-width:34rem){
    form.search{flex-direction:column}
    .go-btn{width:100%}
  }
</style>
</head>
<body>

<div class="brandbar" aria-hidden="true"></div>

<div class="wrap">
  <header class="site">
    <p class="firm">iLonggo Scooter Rental FAQ Search</p>
  </header>

  <section class="panel" id="panel-search">
    <div class="searchbox">
      <form class="search" id="search-form" role="search">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
          <label class="hidden" for="q">Search the FAQ</label>
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Try &ldquo;license&rdquo; or &ldquo;insurance&rdquo;&hellip;" />
          <button type="button" class="clear-btn" id="clear-btn" aria-label="Clear search">&times;</button>
        </div>
        <button type="submit" class="go-btn">Search</button>
      </form>

    </div>

    <div class="meta" id="meta" aria-live="polite"></div>
    <div class="results" id="results"></div>
    <div class="more-row hidden" id="more-row">
      <button type="button" class="more-btn" id="more-btn">Show more results</button>
    </div>

    <div class="state hidden" id="no-results">
      <h2>No results found</h2>
      <p id="no-results-text">Nothing in the FAQ matches. Try fewer words, a shorter term (for example just &ldquo;insurance&rdquo; or &ldquo;fuel&rdquo;), or check the spelling.</p>
    </div>
  </section>

  <footer class="site">
    <span>Updated on Nov 18, 2026.</span>
  </footer>
</div>

<script>
/* FAQ dataset: every Q&A from https://www.ilonggo.fun/faq as published Nov 17, 2026.
   Fields: category, section, question, answer. */
var FAQ_DATA = [{"category": "Company, Location & Hours", "section": "About Us", "question": "Is iLonggo Scooter Rental a licensed company in the Philippines?", "answer": "Yes - We are a fully licensed company located in Iloilo City, Philippines.\n\nFor your reference, we have a business permit, registered with DTI / BIR and comply with all consumer protection laws.\n\nNotes:\n\na. For your safety, always work with licensed companies in the Philippines to avoid bad experiences.\n\nb. Working with unlicensed entities or individual just mean that you will have no recourse if a transaction goes wrong.\n\nc. Unlike unlicensed individuals, we are governed by laws that protect you, the consumer.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "About Us", "question": "Do you have a storefront office?", "answer": "Yes - Click HERE for location of our physical location.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Our Location", "question": "Where are you physically located?", "answer": "Click HERE for location of our physical storefront.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Our Location", "question": "Do we have to come to your rental location?", "answer": "No, but we highly recommend coming to our rental office for the following reasons:\n\nIf this is your first time visiting Iloilo or the Philippines, we have helpful resources available only at our office, including wall maps, snorkeling gear, expat guides, and local travel information. These resources can only be shared with materials permanently displayed in our office.\n\nIf delivery is available, the information our staff can provide off-site during handoff will be limited.\n\nAdditional notes:\n\na. Delivery is subject to staff availability.\n\nb. Delivery fees apply.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Operating Hours", "question": "When are you open?", "answer": "Our regular operating hours are from 9am to 6pm everyday.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Operating Hours", "question": "Why do you close at 6pm?", "answer": "Employee Safety:\n\nWe are deeply committed to the security of our employees. We simply aren’t comfortable asking them to be at the office alone or commuting during the late hours of the night or the very early morning. Keeping our facilities closed during these times ensures that everyone gets home safely.\n\nEmployee Well-Being:\n\nOur team works hard every day to make sure your motorcycle is perfectly maintained and ready for your ride. We believe our staff deserves the same thing we all want: a chance to go home, rest, and enjoy quality time with their loved ones. By closing at 6:00 PM, we ensure that our team stays refreshed, happy, and ready to give you their best service the next day.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Service Area", "question": "Can I ride my rental outside of Panay?", "answer": "For your safety, please notify us of your intent BEFORE you ride outside the Panay mainland.\n\nOur third-party towing service coverage does NOT extend outside of Panay. Therefore, while we do not restrict you to travel out of Panay, it will be your sole responsibility to tow your motorcycle rental back to us in the event of breakdown, accident or any other circumstances.\n\nFailure to return your rental back to our store location, for any reason, will require you to pay us the price of a new motorcycle of the same make and model.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Service Area", "question": "Can I ride my rental to San Joaquin, Antique, Concepcion, Roxas, Carles or Kalibo?", "answer": "Yes. These locations are all within the greater Panay mainland.\n\nSee Map of Panay for travel destinations and travel guides.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Service Area", "question": "What happens if I ride outside the boundary of Panay Island?", "answer": "You will assume all risks and associated costs.\n\nTowing services does not extend beyond Panay Island. Meaning, towing services will not take a roro across water to tow your motorcycle back. If you are stranded outside of Panay, for any reason, you will assume all risks and associated costs.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Service Comparisons", "question": "I was offered something better at another rental company and cannot decide?", "answer": "Make sure you are making an \"apples-to-apples\" comparison.\n\nWe are confident we are better than the competition:\n\na. Start your rental with us, then ride to any other motorcycle company you desire, so you can make an informed decision 😉\n\nb. If you are not satisfied for whatever reason, return your rental within the first hour for a full refund*\n\n*To prevent abuse, this offer is for new customers only.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Company, Location & Hours", "section": "Service Comparisons", "question": "What makes Ilonggo Scooter Rental different from any other Motorcycle Rental company?", "answer": "Motorcycle Rental Selection Guide — Know The Difference. Ask yourself:\n\n1. Do you want to rent from a legitimate company? (DTI / BIR / Business Permits)\n2. Do you need a new, regularly serviced motorcycle? (We care about Rider Safety)\n3. Do you want clean & street-legal helmets? (We care about Helmet Hygiene)\n4. Do you care about reliable emergency roadside assistance? (When you need help, we're just a call away)\n5. Do you like travel route maps and audio guides? (Explore the best spots with ease)\n6. If your plans change, do you need a partial refund? (Flexible Return Policy)\n7. Do you like transparent pricing and more payment options? (Foreigners pay the same rate as locals; Visa, Mastercard, Zelle, Wise)\n\nIf you answer YES to these, that's Ilonggo Scooter Rental — we go beyond just a rental: Legit & Registered Business; Well-Maintained Fleet; Clean & Street-Legal Helmets; Roadside Assistance; Travel Maps & Audio Guides; Flexible Return & Refund Policy; Multiple Payment Options.\n\nIf you answer NO to transparent pricing and more payment options, the guide says: get the cheapest rental you can find. (If anything goes wrong, you get no support.)\n\nWhy Choose Ilonggo? We're not just a rental company. We're your travel partner in Iloilo, Bacolod & Guimaras!\n\nIloilo: 0995-119-4705; Bacolod: 0976-067-4242 — ilonggo.fun", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Rental Requirements", "question": "What are the rental requirements?", "answer": "A. SHOW ABILITY TO RIDE MOTORCYCLE (in English):\n\nValid Physical Driver's License OR International Driving Permit\n\nNote: Motorcycle Classification has to be listed on your driver's license or International Driver's Permit.\n\nAND\n\nB. SHOW PROOF OF IDENTITY:\n\nValid Physical Passport OR Valid Philippines ID / Driver's License OR Valid ACR Card\n\nAND\n\nC. SAFETY DEPOSIT:\n\nPlease provide ONE of the following as your security deposit:\n\n- 2,000 PHP cash, OR\n\n- Your physical passport, OR\n\n- Two (2) accepted Philippines IDs, OR\n\n- One (1) accepted Philippines ID + 1,000 PHP cash (Filipino residents only)\n\nAccepted Philippines IDs (only these are allowed): PH Driver's License, PH National ID, Pag-Ibig Card, ACR Card, PhilHealth Card, or Passport.\n\nNote: The forms of safety deposit listed above shall be held during the duration of your rental.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Rental Requirements", "question": "Mileage Limit & Cleaning Fee", "answer": "Mileage Limit: For rentals of less than 7 days, a mileage limit of 150 km per day applies to all of our motorcycles (125cc and 155cc). Excess mileage will be charged at 4 PHP per km above the limit. Rentals of 7 days or more have no mileage limit.\n\nCleaning Fee: A standard cleaning fee of 150 PHP will be charged if the motorcycle is returned dirty/muddy. Additional charges may apply if the motorcycle requires excessive cleaning.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "Do I need a license to ride a motorcycle?", "answer": "Yes - At minimum, you will need a license from your home country to rent a motorcycle in the Philippines. Your foreign driver's license is only good for your first 3 months upon entry in the Philippines.\n\nTo avoid a 5000 PHP fine and vehicle impoundment, carry your physical driver’s license with you while riding.\n\nIf the vehicle is impounded due to your negligence, you are ultimately responsible for all costs and loss of use till the vehicle is released, so please carry a valid non-expired driver's license when you ride.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "Can I ride short distances without my licence?", "answer": "No. Do NOT ride without your Motorcycle License and/or International Driving Permit (if your license is not in English).\n\nYou will be liable for cost of release from Police Impound and also be liable for loss of use while your rental remains in Impound.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "I have a valid driver's license issued by an ASEAN country, can I use my driver's license in the Philippines?", "answer": "The ASEAN member countries are Brunei, Cambodia, Indonesia, Laos, Malaysia, Myanmar, Philippines, Singapore, Thailand, and Vietnam.\n\nA valid foreign driver’s license from an ASEAN country is generally recognized in the Philippines for up to 90 days from the date of arrival under the \"1985 AGREEMENT ON THE RECOGNITION OF DOMESTIC DRIVING LICENSES ISSUED BY ASEAN COUNTRIES\" (agreement.asean.org). However, if the license is not in English, it is strongly recommended to carry either an International Driving Permit (IDP) or an official English translation to avoid issues with local authorities.\n\nKey requirements and considerations:\n\nValidity: The license must be valid and current, and issued by an ASEAN member country.\n\nTime Limit: Foreign licenses are valid for driving in the Philippines for up to 90 days from arrival.\n\nLanguage: Non-English licenses may require an IDP or official English translation to help local authorities verify the information during traffic stops or inspections.\n\nLong-Term Stay: If staying in the Philippines for more than 90 days, the foreign license must be converted to a Philippine driver’s license.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "If I know how to ride but I do not have a motorcycle license/permit, can I rent a motorcycle?", "answer": "No. Renting and/or riding a motorcycle without a license is not permissible by law.\n\nWe enforce a strict \"No License, No Rental\" policy for safety and legal compliance — you must have a valid driver's license (or an international driving permit, if applicable) to rent a motorcycle from us.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "I do not have the hardcopy of my license. Can I use a digital driver's license on my mobile phone?", "answer": "No - The Philippines requires you to carry a physical original of your driver's license when you ride.\n\nTo avoid a 5000 PHP fine and vehicle impoundment, carry your physical driver’s license with you while riding.\n\nIf the vehicle is impounded due to your negligence, you are ultimately responsible for all costs and loss of use till the vehicle is released, so please carry a valid non-expired driver's license when you ride.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "My driver's license is not in English. Can I ride in the Philippines?", "answer": "No - If your driver's license is not in English, you will need an international driving permit in English with motorcycle classification to ride a motorcycle.\n\nIf the vehicle is impounded due to your negligence, you are ultimately responsible for all costs and loss of use till the vehicle is released, so please carry a valid non-expired international driver's permit when you ride.\n\nAlternatively, if you are planning to stay in the Philippines for more than three(3) months, you may convert your foreign driver's license.\n\nFor details and requirements, see latest information on https://ltoportal.ph/convert-foreign-drivers-license-philippines/", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "I can ride a motorcycle but do not have a driver's license or international driver's permit. Can I rent a motorcycle?", "answer": "No. Renting and/or riding a motorcycle without a license is not permissible by law, and we enforce a strict \"No License, No Rental\" policy — we cannot rent a motorcycle to you, under your name or anyone else's, if you do not have a valid driver's license or international driving permit.\n\nRiding without a license can lead to heavy fines and vehicle impoundment at police checkpoints, and insurance coverage will likely be void if you get into an accident. If the vehicle is impounded, you are ultimately responsible for all costs and loss of use till the vehicle is released.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "License", "question": "How much does it cost to get a Philippines Driver's License?", "answer": "The total cost to convert a foreign driver's license to a Philippine driver's license with the LTO is ₱617.63. This includes the application fee (₱100), computer fee (₱67.63), licensing fee (₱350), and conversion fee (₱100).\n\nHere's a breakdown of the estimated fees: Application fee: ₱100\n\nComputer fee: ₱67.63\n\nLicensing fee: ₱350\n\nConversion fee: ₱100\n\nAdditional costs may apply if:\n\nYour foreign license is expired: An additional fee of ₱75, ₱150, or ₱225 might be added depending on how long your license has been expired.\n\nYou want to add an additional license code: ₱100 per additional code.\n\nYou need to renew your Philippine license: ₱585.\n\nNote: These fees are subject to change, so it's always a good idea to check on https://ltoportal.ph/convert-foreign-drivers-license-philippines/ or your nearest LTO offices for the most up-to-date information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "What is your rental rate?", "answer": "Click HERE for Rental Rates.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "How long is a rental day?", "answer": "For us, one(1) rental day = 24 hours\n\nMeaning, if you start your rental at 1pm today, you return tomorrow at 1pm.\n\nPlease note that other rental companies may charge you for two(2) days, where we charge for one(1).\n\nSo definitely clarify and ask before you commit.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "Do you offer discounts for local Filipinos?", "answer": "We do not practice dual pricing. We have one(1) consistent pricing model for everyone.\n\nDiscounts are already automatically included without having to ask - the longer your rent, the cheaper your daily rental rate.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "Do you offer discounts for long-term rental?", "answer": "Yes - definitely!\n\nDiscounts already reflected in our pricing chart by default - the longer your rent, the cheaper it gets (lower daily rental rate).\n\nHowever, we do offer additional long-term special offers:\n\nOur long-term rental packages are priced from the Motorcycle Rental Rates on our homepage: the package price is the current monthly rate for your motorcycle, multiplied by the number of months in the package.\n\n3 months Rental Duration:\n\n- Includes FREE Scheduled Maintenance\n\n- We provide a loaner motorcycle (or a rebate at your motorcycle's daily rate if a loaner is not available) while we perform scheduled maintainance.\n\n- Provide fresh clean helmet monthly\n\n6 months Rental Duration:\n\n- Includes FREE Scheduled Maintenance\n\n- We provide a loaner motorcycle (or a rebate at your motorcycle's daily rate if a loaner is not available) while we perform scheduled maintainance.\n\n- Provide fresh clean helmet monthly", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "Do you price match a rate from another motorcycle rental company?", "answer": "- Price matching is not a common practice in the Philippines and is offered solely at our discretion, subject to the availability of our motorcycles.\n\n- We encourage you to visit our storefront to personally inspect the condition of our motorcycles and evaluate the quality of the services we provide before making your decision. When comparing prices, it is important to ensure you are making an apples-to-apples comparison based on the motorcycle’s make, model, condition, and overall rental experience.\n\n- We offer a risk-free trial: if you are not satisfied with your rental, you may return the motorcycle within one (1) hour from the start of your rental, with the same fuel level, for a full refund (for new customers only).\n\nNotes:\n\nWe may consider a price match only if you can provide proof of a lower rate from a motorcycle rental company located in Iloilo City for the same motorcycle make, model, and comparable condition.\n\nFor example, we will NOT match prices for:\n\n(a) motorcycles that we do not offer (such as 50cc motorcycles),\n\n(b) rental companies located in another country,\n\n(c) rental companies in another city, and/or\n\n(d) old or poorly maintained motorcycles that are not comparable to our fleet. 😅\n\nContact Us if you have any questions.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Pricing", "question": "What is the price for motorcycle delivery or pick-up fee from/to my hotel or airbnb?", "answer": "Delivery and pick-up fee — one-way fee:\n\n1–4 km: 150 PHP\n5 km: 160 PHP\n6 km: 170 PHP\n7 km: 180 PHP\n8 km: 190 PHP\n10–15 km: 25 PHP per km\n16 km and up: 30 PHP per km\n\nRentals include a full tank of gas; however, delivered vehicles may arrive slightly below full due to transit fuel consumption.\n\nFor returns less than a full tank, we charge 150 PHP for each fuel gauge bar less than full.\n\nWe don't accept rush delivery. Message us and set a schedule for scooter delivery.\n\nNote: the fee chart does not list a 9 km rate.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Payment", "question": "What Payment options are accepted?", "answer": "We accept payments via Credit Cards (Visa & Mastercard), Cash (PHP - Philippines Pesos), PayPal (USD - US Dollar), Zelle (USD), Revolut (PHP or USD), Wise (SGD or PHP), GCash (PHP), PayMaya (PHP), PayNow (SGD - Singapore Dollar) Domestic (PH) Bank Transfers and/or Select Cryptocurrencies / Stablecoins.\n\nNotes:\n\na. Any payments in USD or SGD shall be based on Bank of Philippine Islands (BPI) Buying Rate.\n\nb. See https://www.bpi.com.ph/personal/bank/forex/rates for the latest foreign exchange rates.\n\nc. If you choose to pay via PayPal, please select \"send to friends/family\" instead of \"goods and services\". If you select \"goods and services\", PayPal deducts a fee from the amount you send us. If that happens, we will collect the PayPal fee from you in cash, to offset the PayPal deduction.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Payment", "question": "Why do use the BPI buying rate for currency conversion in lieu of Google's spot exchange rates?", "answer": "When you pay in foreign currency, our bank (BPI) use the buying rate to convert your foreign currency to Philippines Pesos, before depositing funds to our account. Please note that while we get charged bank foreign exchange processing fees, we do not pass this on to our renters.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Payment", "question": "What happens if I leave the country without paying what is owed?", "answer": "Failure to pay for penalties, impoundment fees, rental amount outstanding and/or damages shall constitute as a criminal offense.\n\nWe will file criminal charges against you and file a report with:\n\n- Philippines Police,\n\n- Philippines National Bureau of Investigation (NBI),\n\n- Philippines Department of Justice (DOJ),\n\n- Your Embassy, and\n\n- Local News Networks\n\n- News Networks in your country\n\nNote: We have a record of your IDs and criminal records are shared within Southeast Asia and your Embassy.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Payment", "question": "Do you offer discounts?", "answer": "Discounts are already baked in into our pricing chart - the longer your rental duration, the cheaper your daily rental rate.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Security Deposit", "question": "Do I need to leave my passport for rental?", "answer": "No. You can leave a 2,000 PHP security deposit in lieu of depositing your passport with us.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Security Deposit", "question": "Can I avoid paying a security deposit?", "answer": "Yes - Only if you choose to leave your passport with us.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Security Deposit", "question": "Can I pay a lower amount for my security deposit?", "answer": "Yes — Filipino residents only may pay a lower security deposit of 1,000 PHP if they also provide one (1) accepted Philippines ID (PH Driver's License, PH National ID, Pag-Ibig Card, ACR Card, PhilHealth Card, or Passport). All other renters must use one of the standard options: 2,000 PHP cash, a physical passport, or two (2) accepted Philippines IDs.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Security Deposit", "question": "What is the purpose of my security deposit?", "answer": "A security deposit is ensures you fulfil your rental agreement and return your motorcycle rental in good condition.\n\nIt covers potential damages, unpaid rent, or other breaches of the lease agreement.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Reservations", "question": "Can I place a reservation prior to my rental?", "answer": "Yes - Absolutely. Reservations are welcomed based on availability.\n\nTo place a reservation, contact us to send your digital passport page and driver's license prior to your arrival.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Rental Revisions", "question": "Can I extend my rental?", "answer": "Yes.\n\nTo help us best accommodate your motorcycle extension and avoid reserving your motorcycle to another customer, please notify us at the soonest possible.\n\nPlease understand that we may not be able to accommodate your extension request if you notify us on the last day of your rental.\n\nIn some instances, we may require you to return and switch your vehicle to accommodate reservations or scheduled motorcycle maintenance.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Rental Revisions", "question": "Can you revise my daily rate to match my revised longer duration?", "answer": "No. We understand that plans change, but we do not revise the daily rate of an existing contract when you extend your rental.\n\nWe will issue you a new contract for the extension period, and the extension will be treated as a fresh new rental, charged at the daily rate that applies to the extension period's duration.\n\nExample:\n\nIf you rent for 6 days (3,600 PHP in total) and then extend for another 6 days, the extension is a new rental at 600 PHP/day (3,600 PHP), under a new contract.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Requirements, Pricing, & Payments", "section": "Rental Revisions", "question": "Do you provide refund for unused rental days if I need to reduce my rental duration?", "answer": "Within one (1) hour from the start of your rental period, new customers may return the rental for a full refund. You do have to refuel the vehicle to the same fuel level you received when you picked up the vehicle.\n\nIf you return your rental earlier than your contracted duration, you will be charged the daily rate that matches your actual rental duration, according to our pricing chart, and we will refund your unused balance.\n\nExample A: If you start with 7 days (3,500 PHP weekly rate) and decide to just rent for 5 days (600PHP x 5 days = 3,000PHP total), we would return your (3,500 PHP - 3,000 PHP = 500 PHP) unused balance.\n\nExample B: If you start with one(1) month (365 PHP/day x 30 days = 10,950 PHP) and decide to return after just 5 days, you will be charged the regular daily rate for a rental of less than 7 days (600PHP x 5 days = 3,000PHP total), and we would return your (10,950 PHP - 3,000 PHP = 7,950 PHP) unused balance.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Motorcycle Options", "question": "What motorcycles/scooters are available for rent from iLonggo Scooter Rental?", "answer": "We only offer three(3) types of motorcycles:\n\nA. Honda Click V4 125cc - Great for city use.\n\nB. Suzuki Burgman Street EX 125cc - Wider seat and longer leg-room. Best for cruising on long distances.\n\nC. Yamaha Lexi 155 cc - Best for steep inclines and long distances.\n\nTo place a reservation, contact us to send your digital passport page and driver's license prior to your arrival.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Motorcycle Options", "question": "Are your motorcycles clean?", "answer": "Yes - we wash our motorcycles and sanitize interior surfaces prior to every rental.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Rental Inclusions", "question": "Do you perform mechanical checks on your motorcycle?", "answer": "Yes. Every motorcycle in our fleet undergoes a thorough 6-point pre-ride inspection before handing over the keys to ensure your safety.\n\nBraking System: We inspect the brake pads, rotors, lines, and fluid levels to guarantee reliable stopping power and zero fluid leaks.\n\nTires & Pressure: We check tire pressure, tread depth, and rubber condition to ensure maximum road grip and prevent blowouts.\n\nEngine Oil & Fluids: We verify oil levels and clarity to keep the engine lubricated, running cool, and shifting smoothly.\n\nCooling System: We check the coolant level, radiator, and fan operation to prevent overheating in traffic.\n\nAir Filter: We inspect the filter to make sure the engine gets clean air for optimal throttle response and fuel efficiency.\n\nSpark Plugs & Ignition: We check the spark plugs to guarantee effortless starts and smooth idling.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Digital Guides", "question": "Do you offer a guide with your motorcycle rental to ride me around?", "answer": "No - For now, we offer self-guided audio tours. Meaning, you self-ride your motorcycle rental and follow along our point-to-point route map.\n\nWe provide audio narration guides for you to listen to for historical and cultural information of attractions within Iloilo City.\n\nContact us to place a reservation or learn more.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Helmets", "question": "Are your helmets clean?", "answer": "Unlike other motorcycle rental companies, we handwash our helmets clean, by hand, after every rental:\n\n(a) The soft fabric helmet liners are hand-washed clean with laundry detergent.\n\n(b) The hard shell, visor and straps are sanitized with antiseptic/disinfectant alcohol solution.\n\nWe are riders ourselves and hate stinky helmets - it is tedious to wash and clean by hand, but we will not compromise on helmet hygiene.\n\nThis is our guarantee!", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Helmets", "question": "Am I required to wear helmets while riding?", "answer": "Yes - Both the rider and pillion (passenger) are required to wear street legal helmets. This is required by law.\n\nWear the authorized/licensed street legal helmets we provide with your rental, while riding.\n\nThose nut shell helmets you may be used to in Vietnam, Siargao or Palawan will get you a traffic violation and fine in Iloilo City.\n\nNot wearing a any helmet will result in a fine and risk vehicle impoundment. If the vehicle is impounded due to your negligence, you are ultimately responsible for all costs and you shall continue to incur rental costs till the vehicle is released.\n\nFor detailed information, visit LTO Website (ltoportal.ph) for most current Philippines LTO (Land Transport Authority) requirements.\n\nWe provide two (2) helmets — a rider helmet and a pillion helmet. The rider helmet is thoroughly hand-washed clean, as its foam liners are detachable. The pillion helmet's foam liners are not detachable, so it is hand-wiped clean with non-toxic anti-bacterial wipes.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Helmets", "question": "Do NOT forget to secure helmet(s) when you park your motorcycle.", "answer": "If your helmet is stolen, you will have to pay 3,500 PHP to replace helmet.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Tires", "question": "What do I do if I have a flat tire?", "answer": "If you experience a flat tire while driving, don’t panic. The standard solution is to visit a vulcanizing shop. These are specialized local businesses equipped to handle tire repairs.\n\nVulcanizing shops serve as your primary roadside assistance for tire issues:\n\n- Puncture Repair: They seal holes using \"cold patching\" or heat-curing methods.\n\n- Tire Services: They can unmount and remount tires onto rims.\n\n- Air Services: They provide inflation via air compressors and pressure checks.\n\n- Minor Maintenance: Many shops also handle basic mechanical tasks, such as battery replacements or tire balancing.\n\n- Cost: Repairs are very affordable, typically ranging from ₱100 to ₱200.\n\n- Accessibility: These shops are everywhere. They are highly localized, walk-in businesses that do not require appointments.\n\nHow to Find Help:\n\nA. If you are currently stranded, here is how to locate the nearest shop:\n\nB. Google Maps: Open your app and search for \"vulcanizing shop near me\".\n\nC. Ask Locals: Ask nearby residents, traffic enforcers, or sari-sari store owners; they will almost always know the nearest shop.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Fleet, Inclusions & Equipment", "section": "Tires", "question": "What are the required front and back tire pressures?", "answer": "The required tire pressures are listed on the motorcycle:\n\nA. Below the swing arm (where your knees would be if you are seated on the motorcycle).\n\nOR\n\nB. On the side of your underseat storage compartment.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Pick-Up", "question": "Can you accomodate pick-ups after operating hours?", "answer": "Employee Discretion: After 6pm and before 9am, requests are managed directly by our team members. If they are available and willing to help you outside of their normal shift, they have the flexibility to say yes.\n\nSupporting the Team: Because these accommodations happen on their personal time, the \"After-Hours Pick-Up Fee\" of 100 PHP/hour go directly to the employee.\n\nWe truly appreciate you helping us protect the well-being of our team. Thank you for your understanding.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Pick-Up", "question": "Can we pick-up our rental at 5am?", "answer": "You are welcomed to ask, but please understand that this is at the sole discretion and availability of our employees.\n\nAfter-hours Fee = 4 hours (before we open at 9am) x 100 PHP/hr = 400 PHP", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "If I rent for 1 day, when should I return?", "answer": "Unlike other motorcycle rental companies, our rental day is equivalent to 24 hours.\n\nMeaning, if you rent today @10am, you are required to return your motorcycle rental by 10am tomorrow.\n\nBeware of unlicensed motorcycle rental companies that bait you with a lower rate, but require you to return at the end of the same rental day! If you return the next day, these deceptive rental companies would charge you for two(2) days instead of one(1) day.\n\nContact Us if you have any questions.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "Can you accomodate returns after operating hours?", "answer": "Employee Discretion: After 6pm and before 9am, requests are managed directly by our team members. If they are available and willing to help you outside of their normal shift, they have the flexibility to say yes.\n\nSupporting the Team: Because these accommodations happen on their personal time, the \"After-Hours Return Fee\" of 100 PHP/hour go directly to the employee.\n\nWe truly appreciate you helping us protect the well-being of our team. Thank you for your understanding.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "How are Late Return Fees calculated?", "answer": "If you return your rental late, you will be charged 100 PHP per hour (billed in full-hour intervals) after your 1-hour grace period expires.\n\nTherefore, if your designated return time is 9am today but you return:\n\n- today, before 10am, there will be no late fees.\n\n- today, from 10.01am to 11am, your Late Fee is 100 PHP/hr x 1hr = 100 PHP\n\n- today, from 11.01am to 12noon, your Late Fee is 100 PHP/hr x 2hr = 200 PHP\n\n- today, from 12.01pm to 1pm, your Late Fee is 100 PHP/hr x 3hr = 300 PHP\n\n- and so on, at 100 PHP for each additional hour or part of an hour, until the motorcycle is returned.\n\nNote: We close at 6pm, and the 1-hour grace period does not apply after 6:00 PM. Returns after 6pm are charged the After-Hours Return Fee instead, at 100 PHP per hour from 6pm onwards. 100% of this after-hours fee goes directly to our staff for accommodating your request.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "How do I avoid late fees?", "answer": "a. Plan to return your rental at your stipulated time of return.\n\nb. Call us BEFORE your stipulated time of return, to extend your rental for another day at your motorcycle's daily rate.\n\nNotes:\n\n- Extensions are subject to approval and dependent on motorcycle availability.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "What happens if I fail to return my motorcycle at my designated return date?", "answer": "We will automatically apply an additional day at your motorcycle's daily rate.\n\nIf we do not hear from you for three(3) consecutive days, we will file a missing persons report and/or theft with the police.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "It is an emergency and I cannot return before closing. Can you accomodate?", "answer": "A. Do NOT just show up after operating hours expecting service and assistance.\n\nIf you find yourself in a situation where you absolutely need an after-hours return, please reach out to us BEFORE your stipulated return time.\n\nB. Do NOT make our employees wait till 10pm, then call us last minute to extend your rental.\n\nCall us BEFORE your stipulated return time to extend another day at your motorcycle's daily rate.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "I called your staff at 9pm that I will just return tomorrow, why do I still have to pay the late fees?", "answer": "If you asked our employee to wait for you till 9pm, changed your mind, and informed them of your extension only at 9pm, you are still liable for making them wait for you after the business is closed.\n\nIn this case, you will be paying the agreed 100 PHP/hr After-Hours Return Fee past your return time, plus the additional extension day at your motorcycle's daily rate.\n\n100% of this \"After-Hours Return Fee\" go directly to our staff as compensation.\n\nExamples:\n\nA. Your stipulated time of return is today at 6pm, but specifically requested a late return at 9pm, then called at 9pm to extend for an additional day. In addition to the extension day at your motorcycle's daily rate, a 300 PHP After-Hours Return Fee still applies because our staff waited three(3) hours for your requested 9pm drop-off tonight. Extending your rental does not waive this After-Hours Return Fee.\n\nB. Your stipulated time of return is tomorrow at 2 pm, you insist on returning at 9 pm tonight, then called at 9 pm to notify our staff that you changed your mind. A 300 PHP After-Hours Return Fee still applies because our staff waited three(3) hours for your requested 9pm drop-off tonight. Changing your return time back to tomorrow at 2:00 PM does not waive this After-Hours Return Fee.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "My flight is after your 6pm closing time. Can I return just before I fly out?", "answer": "While we try to accomodate our customers as best we can, please understand that our workers have obligations and commitments outside of work, just like you do.\n\nAs much as we want you to maximize your rental, we want to be very respectful of our staff's personal time outside of work. We hope you understand that our staff may not be able to accomodate your requests. Especially if you choose to return past midnight. Thank you for your understanding.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "I am late for my flight. Can you collect my motorcycle rental from my hotel?", "answer": "As much we try our very best to accomodate our customer, it has to be within reason.\n\nUnless you inform us ahead of time and we have staff available to accomodate, we cannot assist with last-minute pick-up requests.\n\nEspecially not after work hours (9am to 6pm).", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "If you plan to extend your rental duration, let us know as soon as possible.", "answer": "Do not wait on the very last day/hour of your return as we may already have your motorcycle reserved for the next renter.\n\nTo avoid misunderstanding and disappointment, please notify us at the every soonest.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "Do NOT abandon your motorcycle rental, for any reason.", "answer": "If you abandon your motorcycle, for any reason, we will report you to the police, airport customs and the Philippines Bureau of Immigration.\n\nYou will be liable for the cost to replace your motorcycle rental.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Returns", "question": "Are there discounts for early return?", "answer": "No. Our rental is for a full 24 hour day period. There are no discounts for returning the motorcycle earlier that your scheduled return time.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Fuel", "question": "What type of fuel/gas is required to fill up the motorcycle?", "answer": "PREMIUM 95 (Red)\n\nThis is clearly labeled on or next to our tank cap. You will be liable for damages and loss of use if you refill motorcycle with the wrong fuel/gas type.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Fuel", "question": "What happens if I ran out of fuel and got stranded?", "answer": "We understand that mistakes happen. If you forgot to fill-up gas / fuel and are left stranded, you have a few options, but please note that you are responsible for any costs incurred. Here is how you can resolve this:\n\nOption 1: Get Help Locally\n\nFilipinos are very helpful if you ask for help.\n\nAsk a passing rider for assistance to drop you off to the nearest gas station to get a liter of fuel / gas (Premium 95 - Red Color) and return to your motorcycle to fill your gas tank under your seat. Then ride your rental to the nearest gas station and fill it to full tank.\n\nOption 2: Grab / Taxi to Nearest Gas / Fuel Station\n\nGet a liter of fuel / gas (Premium 95 - Red Color) at the nearest gas / fuel station and return to your motorcycle to fill the gas tank under your seat. Then ride your rental to the nearest gas station and fill it to full tank.\n\nOption 3: Professional Towing\n\nYou can pay for a 3rd-party towing service to either open the seat storage on-site or tow the motorcycle back to our office.\n\nOption 4: On-Site \"Rescue Service\" (Subject to Availability)\n\nDepending on where you are and when it happens, we may be able to send a staff member with a spare key to rescue you.\n\nCost: You will be charged a Rescue Fee (payable directly to the staff member). This fee fluctuates based on current fuel and ride-hailing rates.\n\nHow It Works: A staff member must first travel to our office to pick up the spare key before riding out to your location.\n\nImportant Note: On-site rescues are provided at our staff's discretion and depend on available manpower.\n\n⚠️ After-Hours Operations (After 6:00 PM)\n\nIf you require assistance after 6:00 PM, An additional After-Hours Return Fee of 100 PHP/hr will apply.\n\nReason: For an on-site rescue after hours, staff must travel to open the office, retrieve the spare key, coordinate the dispatch, and wait for the key’s return. All associated labor and travel costs will be billed to you.\n\nContact Us for assistance and instructions.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Fuel", "question": "Do I have to refuel my rental upon return?", "answer": "Yes. To avoid fuel surcharge/fees, return the motorcycle with a full tank.\n\nRentals include a full tank of gas.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Fuel", "question": "What happens if I return my rental without refueling?", "answer": "Option 1 - The gas station is very close to our office and we will give you the opportunity to go refuel before returning your rental.\n\nOption 2 - We will charge you 150 PHP for each fuel gauge bar less than a full tank, as reflected on the motorcycle fuel indicator.\n\nFuel Fee = 150 PHP x (no. of bars on a full tank - no. of bars when you return)\n\nExample Calculation:\n\nIf a full tank is five (5) bars and you return it with two (2) bars = 150 PHP x (5 - 2) = 450 PHP", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Key", "question": "What happens if I lose my motorcycle key?", "answer": "Motorcycle will be towed back to our office at renter's expense. Renter is responsible for replacement of key prior to return.\n\nPricing are listed in our office.\n\nContact Us for assistance and instructions.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Key", "question": "Do NOT walk away with key left in ignition and engine running.", "answer": "(a) If the motorcycle is stolen, the first thing you do is to file a Police Report. You shall be be liable for the price of a NEW motorcycle to replace the loss due to theft.\n\n(b) If the battery goes flat due to your negligence, and you cannot start the motorcycle, you will be liable for towing costs to dealership. Your negligence will not invalidate your rental. A loaner/replacement may not be available. You assume the risk of disrupting your trip and travel plans.\n\n(c) If you run out of fuel due to your negligence, you will be liable for all costs associated with towing or rescue. Your negligence will not invalidate your rental. A loaner/replacement may not be available. You assume the risk of disrupting your trip and travel plans.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Key", "question": "What happens if I accidentally lock my key under the motorcycle seat?", "answer": "We understand that mistakes happen. If your keys are locked under the seat, you have a few options, but please note that you are responsible for any costs incurred. Here is how we can resolve this:\n\nOption 1: Professional Towing\n\nYou can pay for a 3rd-party towing service to either open the seat storage on-site or tow the motorcycle back to our office.\n\nSee 'What happens if I ran out of fuel and got stranded?' under Fuel for our On-Site Rescue Service and after-hours fee.\n\nContact Us for assistance and instructions.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Motorcycle Parking", "question": "I am staying at Avida Towers. Where can I find motorcycle parking?", "answer": "Speak to the guards for assistance. There are free parking spaces for motorcycles. As more towers are being built, parking spots may change over time.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Motorcycle Parking", "question": "I am staying at One Spatial. Where can I find motorcycle parking?", "answer": "As you enter the condominium entrance, ride all the way to the very end of the road for the generators are located for free first-come-first-serve parking. If these parking spaces are full in the evening, you are welcome to park at our office.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Motorcycle Parking", "question": "I stay in a condominium around Megaworld. Where can I find motorcycle parking?", "answer": "If you are staying at an airbnb around megaworld (St Honore, Palladium, One Madison, Lafayette Square, etc) that has no dedicated motorcycle parking, there is multi-storey parking garage above the transport hub and along taft street (behind K-Town shophouses and condominiums).\n\nSee map below for free parking options available on a first-come-first-serve basis.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Personal Belongings", "question": "Do NOT leave anything behind in the motorcycle glove compartment and storage under your seat.", "answer": "Please note that we are not responsible for shipping any items you left behind.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Personal Belongings", "question": "Do NOT leave personal belongings unattended with the motorcycle.", "answer": "- Remove your phones from phone holder before you walk away.\n\n- Do not leave keys or valuables in the glove compartment.\n\n- Do not leave your bags unattended.\n\nOur staff has to be physically present in the office and cannot assist with filing a police report or help you find lost items.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Luggage Storage", "question": "I plan to return to Iloilo. Can I store my bags till my next return?", "answer": "Yes - Additional fees will apply. Call or swing by our office for up to date pricing for luggage storage.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Pick-Up, Returns, Fuel & Operations", "section": "Mail Collection", "question": "Can you help collect mail/package on my behalf while I am travelling or away?", "answer": "Yes - Contact Us for more information and fees.\n\nOrder items from Amazon, Shopee, Lazada, etc and use our store location for delivery.\n\nShipping Address\n\nAttn: Mary Ordona\n\niLonggo Scooter Rental\n\nR.Mapa Street, Tabucan (Mandurriao), Iloilo City, Iloilo 5000, Philippines\n\nImportant: Provide phone number (+63) 995-119-4705\n\nTERMS & NOTES:\n\n(a) If you do not provide our phone number (+63) 995-119-4705, you risk not receiving your mail/package.\n\n(b) We will only receive items on your behalf but please note that we do not have the resources to track, monitor and provide updates.\n\n(c) Deliveries are notoriously late in the Philippines and do not usually get delivered as scheduled. Do not be alarmed or concerned.\n\n(d) We have no ability or power to make your delivery arrive faster.\n\n(e) We are not responsible for damaged or missing deliveries.\n\n(f) It is your responsibility to monitor delivery status with your delivery provider.\n\n(g) We will charge storage fees for late collection (100 PHP per week)\n\n(h) Unless directed otherwise, unclaimed packages will be disposed after 3 months.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Emergency Contact", "question": "Who do I call in the event of an emergency?", "answer": "Refer to our Emergency Hotline section on our Expat Resource page.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Accidents", "question": "What do I do if I accidentally fell while riding and scratched/damaged the motorcycle body?", "answer": "Step 1 - If there are serious injuries to you, your pillion or 3rd party, call the police and ambulance for assistance.\n\nRefer to our Emergency Hotline section on our Expat Resource page.\n\nStep 2 - Call to notify us of the accident and extend of damages (scratch, cracked motorcycle component, damaged headlights. etc)\n\nStep 3A - For minor damages/ scratches, it is primarily your responsibility to repair minor damages prior to your return date. To be fair and transparent, we will provide you a location to go to, and, have scratches/damages fixed at your own expense and time. Alternatively, you can have us conduct the repair on your behalf. See fee schedule posted (on wall) in our office/storefront for costs.\n\nOR\n\nStep 3B - For major accidents, we will tow to dealership at your expense, and provide you a quotation of repair for all damages for payment. We would have to hold your passport till you pay for damages. Alternatively, if you need to leave immediately, you are required to deposit funds for the amount of a new motorcycle of similar model and make. We will reimburse you the difference once payments are processed for repairs, loss of use and processing fees due to staff wages. We will provide you a receipt for final costs of repairs, with which you will use to file a claim with your insurance provider.\n\nOR\n\nStep 3C - If motorcycle is deemed a total loss by mechanic, you will be required to pay the cost of a new motorcycle of the same make and model.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Accidents", "question": "What is the payment procedure in the event of an accident, with or without insurance?", "answer": "See the Insurance section — \"I purchased insurance from a 3rd party provider, what happens in the event of an accident or theft?\" and \"What if I do not buy insurance?\"", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Accidents", "question": "Why am I liable for a new bike replacement if I totaled my rental?", "answer": "Because that is exactly what we have to do ourselves if we are forced to replace any motorcycles in our fleet.\n\nAlternatively, we will also accept a like-for-like replacement (same make, model, condition, odometer reading within 200km variance from reading at point of rental), and, renter to bear the costs of prompt transfer of ownership to iLonggo Scooter Rental, to allow for immediate use.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Breakdown", "question": "What do I do in the event that my motorcycle rental is to breakdown on the road or fail to start?", "answer": "While this is highly unlikely as our motorcycles are 2023 models or newer, regardless, here are some guidelines should this apply.\n\nStep 1 - Call us to explain the circumstances of the breakdown/malfunction, and steps you may have attempted to troubleshoot.\n\nMost issues are easy to troubleshoot over the phone; (1)check fuel tank gage if its empty, (2)if side stand is not fully lifted, the start button will not work.\n\nStep 2 - If simple troubleshooting fails, send to our WhatsApp account. We will dispatch a towing provider to your shared location within Panay Island. As it may take awhile to reach you from Iloilo City, you are not expected to stay at this exact location and wait. Do stay in close proximity to your motorcycle, if possible.\n\nStep 3 - Once the motorcycle is retrieved, you have the following options: (a) return back to Iloilo City with towing provider OR (b) Hand-over your physical driver's license to the towing company and continue on your trip with alternative transportation\n\nStep 4 - Motorcycle will be inspected by a mechanic and we will notify on next steps. Unless the breakdown is caused by your negligence, you are not liable for towing and repair costs.\n\nNote: While you are allowed to ride outside of Panay, be aware that we cannot assist you outside of Panay Island.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Breakdown", "question": "What is the payment procedure in the event of a breakdown caused by me, with or without insurance?", "answer": "See the Insurance section — \"I purchased insurance from a 3rd party provider, what happens in the event of an accident or theft?\" and \"What if I do not buy insurance?\"", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Towing", "question": "How do I arrange for towing?", "answer": "Step 1 - Call to notify us. We will provide the location for the nearest authorized dealership or mechanic.\n\nStep 2 - The number to call for towing is located under the seat of your motorcycle rental.\n\nStep 3 - Provide motorcycle pickup location. If convenient, you may have be required to be present at point of pick-up.\n\nStep 4 - Depending on circumstances and location, we may require you to pay the towing fee directly to towing provider and get a receipt for proof of payment and service.\n\nStep 5 - Send proof of payment via whatsapp or facebook messenger.\n\nStep 6 - You may ride along with towing company to nearest city, if needed.\n\nStep 7 - Await further instructions, if applicable.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "Is insurance included with my rental?", "answer": "Only TPL (Third Party Liability) insurance is provided with your rental at no additional charge.\n\nRental pricing does not include coverage for (1)personal yourself, your pillion rider and your motorcycle rental.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "What are my insurance options?", "answer": "TPL (Third Party Liability) insurance is required by law and provided at no additional charge with our rentals.\n\nOption 1 - If you already have insurance coverage in your home country, your first step is to verify if they would extend coverage while you are traveling abroad.\n\nOption 2 - We will offer options (provided by 3rd party insurance providers) for you to choose from.\n\nOption 3 - Get an insurance of your choice.\n\nOption 4 - Self-insure. Meaning, you agree to bear all costs as a result of theft or damages.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "What types of insurance do I need?", "answer": "A. Insurance for personal injury for yourself and/or pillion rider, if applicable.\n\nB. Insurance for loss due to theft and/or damages due to accident to motorcycle rental\n\nTip: Look for online travel insurance providers with motorcycle sports/rental coverage.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "What is TPL (Third Party Liability) insurance?", "answer": "TPL (Third Party Liability), also called CTPL (Compulsory Third Party Liability), is required by Philippines law. It only covers bodily injury or death caused by you to a 3rd party (other than yourself and your pillion rider), up to 100,000 PHP.\n\nIt does not cover damage to property, damage to the motorcycle, or injuries to yourself or your pillion rider.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "How much does insurance cost?", "answer": "Only TPL (Third Party Liability) insurance is provided with your rental at no additional charge.\n\nPersonal accident, personal property and vehicle insurance pricing varies depending on various factors determined by 3rd party insurance providers such as country of origin, credit rating, duration of coverage, age, etc.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "I purchased insurance from a 3rd party provider for, what happens in the event of an accident or theft?", "answer": "Step 1 - You pay for the damages or loss of property first with your own funds.\n\nStep 2 - We will issue you a receipt for your payment.\n\nStep 3 - You file an insurance claim for reimbursement directly from your insurance provider\n\nNote: Be aware of your insurance coverage deductible (minimum amount you are liable for). Check your insurance policy.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "What if I do not buy insurance?", "answer": "You will bear full responsibility for all costs for (1) damages to motorcycle rental, (2) loss of rental due to damages to motorcycle rental, (3) personal medical costs for yourself and your pillion rider.\n\nWorst case scenario: In the event the motorcycle rental is totaled (unrepairable damage), you will just pay for the cost of a new motorcycle of the same make and model.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "Does it make sense to get personal accident insurance and vehicle insurance?", "answer": "This decision is solely yours to make.\n\nFor consideration:\n\nEvery insurance policy includes a deductible value. Meaning, the insurance company will typically only reimburse anything above this amount. If your deductible is not much different from the totaled value of your rental motorcycle, you may choose to not get insurance.\n\nSimilarly, if you have the means to provide self-coverage for any personal injury, then it is your call to get personal accident insurance.\n\nEither way, rental providers in the Philippines (us included) will not be held liable in the event of loss, damage or injury.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Insurance", "question": "Why don't you offer vehicle insurance?", "answer": "That is a great question!\n\nLocal Underwriting Restrictions: All vehicle insurance in the Philippines must be underwritten by a licensed domestic insurance company. Currently, local insurers are unwilling to take on the liability of insuring foreign riders.\n\nHigh Deductibles vs. Low Value: Even through third-party online providers, deductibles are typically set at around $500 USD for minor damages and up to $1,000 USD for a total loss. Because of this, the policy provides very little practical protection, and the daily insurance premiums would often end up costing more than the scooter rental itself.\n\nRegulatory Compliance: As a licensed motorcycle rental company rather than a registered insurance provider, we are legally not permitted to sell insurance products.\n\nConsistent with industry practice, we keep insurance separate from the rental price and at the renter's sole discretion — every renter's needs are different, so you can choose the coverage that best fits your needs.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Travel Insurance", "question": "Travel Insurance", "answer": "SAFETY WING (US Company)\n\n- Covers motorcycles and scooters over 50cc (such as standard 125cc+ rentals like a Honda Click) using the SafetyWing Nomad Insurance plan (formerly Nomad Insurance or Nomad Essential) only when paired with the Adventure Sports Add-on.\n\n- Alternatively, their SafetyWing Nomad Complete tier includes higher-level coverage that handles motorcycles above 50cc without needing a separate add-on.\n\nKey Requirements for Coverage\n\n- Engine Size: The base Nomad Essential plan only covers motorbikes up to 50cc by default. You must select the Adventure Sports add-on for bikes over 50cc (which applies to 125cc and higher).\n\n- Valid License: You must hold a valid motorcycle/scooter license from your home country plus a matching International Driving Permit (IDP) if required locally. A standard car driver's license is not sufficient for 125cc+ bikes.\n\n- Safety Gear: You must wear a helmet.\n\n- Sobriety & Laws: You must ride sober (no drugs or alcohol) and follow local traffic laws.\n\n- Excluded: These plans cover your medical expenses if you get in an accident, but they do NOT cover personal liability for damage to the rental bike itself or third-party vehicle/property damage.\n\nGENKI TRAVELER (EU Company)\n\n- Covers light motorcycles and scooters up to 125cc / 11kW and a max top speed of 110 km/h. Under Genki Traveler covers you even if you do not hold a specific motorcycle license (subject to wearing a helmet as a driver).\n\n- If you ride a motorcycle above 125cc, a valid, legal motorcycle/driver's license for that engine size is strictly required by the policy. Riding a bike over 125cc without the proper legal license will result in a claim denial.\n\n- Class Matching: Your license must legally authorize you to operate a vehicle of that specific engine power or displacement (e.g., if you are riding a 250cc bike, your license cannot be limited to 125cc maximums).\n\n- Your license must be legally recognized in the Southeast Asian country where you are driving. In most of Southeast Asia, this means you must carry your domestic motorcycle license accompanied by a valid International Driving Permit (IDP) corresponding to the correct category (typically Class A for motorcycles).\n\n- Excluded: These plans cover your medical expenses if you get in an accident, but they do NOT cover personal liability for damage to the rental bike itself or third-party vehicle/property damage.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "Do NOT attempt to ride steep/rough roads at low visibility and/or bad weather.", "answer": "While most roads in Iloilo City and Guimaras are relatively flat, some provincial areas require a steep climb on unpaved roads. So definitely plan your route ahead of time if you plan to explore the bigger Island of Panay.\n\nWhen in doubt, stay safe and turn around. Your life is precious. Do not take unnecessary risks.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "AVOID steep/rough roads listed below if you are a novice rider.", "answer": "Leon, Iloilo → Bucari Pine Forest: Steep, bumpy ride, but accessible for experienced rider.\n\nKnown for continuous uphill climbs and tight switchbacks, and accident prone for novice rider.\n\nDo NOT attempt at low visibility and/or bad weather conditions.\n\nAdditionally, see item no.3 below but areas to AVOID.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "DO NOT ATTEMPT TO RIDE THE AREAS LISTED BELOW:", "answer": "⛔ Mount Madja-as: Extreme elevation gain, narrow access roads, trail-like paths and \"knife-edge\" ridges.\n\n⛔ Mount Nangtud: Extreme elevation gain, narrow access roads, trail-like paths and \"knife-edge\" ridges.\n\n⛔ Lambunao (Iloilo) → Valderrama / Antique: Sharp switchbacks, loose gravel, landslides, fog, no guardrails.\n\n⛔ Bugasong → Valderrama: Sharp switchbacks, loose gravel, landslides, fog, no guardrails.\n\n⛔ Igbaras → Tubungan → Antique: Sharp switchbacks, loose gravel, landslides, fog, no guardrails.\n\n⛔ West Coastal Road (Antique): Narrow lanes with blind curves, occasional broken pavement, no barriers.\n\nIn the event that you are stranded, or worse, get into an accident, towing/emergency services will not be able to reach you promptly.\n\nYou will assume all risk and costs associated.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "Do NOT ride your motorcycle on beach sand or saltwater.", "answer": "(a) Your tires will not have traction in soft sand and you will fall. You will be liable for any damages.\n\n(b) In the event of saltwater damage, you will be liable for costs of repair and loss of use.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "Do NOT run out of fuel and get stranded.", "answer": "Keep an eye on the fuel/gas level as displayed on motorcycle display panel.\n\nFill up gas/fuel BEFORE gas/fuel level meter blinks so you do not risk getting stranded.\n\nIf you get stranded because you run out of gas, we will have to call for towing, at your expense, to the nearest gas station.\n\nNote: The independent towing service nearest to you may not have a fuel can.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Safety", "question": "Do NOT ride while under the influence.", "answer": "This is a serious offense and you will be jailed and rental motorcycle impounded.\n\nAny expense to release motorcycle and loss of use will be charged to you.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Attire", "question": "Do I need to wear shoes when I ride a motorcycle in the Philippines?", "answer": "Yes - closed footwear is required by law.\n\nWhile flip-flops are accepted in Thailand, Vietnam, Siargao or Palawan, it is a traffic violation in Iloilo and will result in 1500 PHP fine.\n\nFor complete information on requirements, visit https://ltoportal.ph/dress-code-motorcycle-drivers/ for most current Philippines LTO (Land Transport Authority) requirements.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Attire", "question": "What are the dress code requirements in the Philippines?", "answer": "For complete information on requirements, visit https://ltoportal.ph/dress-code-motorcycle-drivers/ for most current Philippines LTO (Land Transport Authority) requirements.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Attire", "question": "Do I need to wear a shirt?", "answer": "Yes. This is the law.\n\nIf your rental gets impounded for non-compliance, you shall be responsible for costs associated for release of motorcycle from police impound and any loss of use.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Rider Attire", "question": "Are reflective safety vests provided under your motorcycle seat?", "answer": "No. Reflective safety vests are no longer provided under the motorcycle seat by default. A reflective safety vest is available as an optional add-on — just let us know when you book if you would like one.", "url": "https://www.ilonggo.fun
