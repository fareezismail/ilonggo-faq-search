/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Impoundment", "question": "What happens if the motorcycle gets impounded because I do not carry my license?", "answer": "You will be liable for, and continue to accrue rental costs. Pay your fines to LTO, release the motorcycle from impoundment, and return it back to us to complete your rental period.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Insurance, Legal & Procedures", "section": "Harassment", "question": "Can I ask for your staff's personal phone number?", "answer": "To ensure a safe and respectful environment for everyone, please observe the following:\n\n- Respect Professional Boundaries: Our staff are here to assist you professionally. Please refrain from requesting personal contact information (such as phone numbers). If you wish to provide your contact details for anything other than business purposes, our staff will decide at their own discretion whether to respond.\n\n- Zero Tolerance for Harassment: We maintain a zero-tolerance policy regarding harassment in any form. Please be advised that our premises are under 24/7 video surveillance.\n\n- Legal Compliance: Harassment is a serious offense under Philippine law. We strictly uphold Republic Act No. 11313 (The Safe Spaces Act), which penalizes gender-based sexual harassment and inappropriate conduct in public spaces and places of business.\n\nWe appreciate your cooperation in keeping our workplace safe and respectful.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Iloilo", "question": "I am visiting Iloilo for the first time. How do I prepare?", "answer": "We are your one-stop resource to everything Iloilo:\n\n1. For tourist information, see our Iloilo Travel Guides.\n\n2. If you plan to stay or live in Iloilo, see our Expats Guides.\n\nContact us if you need more information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Iloilo", "question": "What is there to do in Iloilo?", "answer": "There is plenty to explore and do not just in Iloilo but in the greater island of Panay, where Iloilo is located.\n\nThere are plenty of running social, waterfalls/hiking, snorkeling/swimming and much more!\n\nSee our Iloilo Guides as a starting point for your research.\n\nAlternatively, browse local youtube channel (www.youtube.com) (not in english) that focuses on outdoor activities in specifically for the island of Panay.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Guimaras", "question": "Can I ride my rental to Guimaras Island?", "answer": "Yes. Guimaras is the nearest island to Iloilo City and can just be a day trip.\n\nStart your rental from Ilonggo Scooter Rental - Iloilo Branch (maps.app.goo.gl), then take a 15 minutes ride to Jordan Port Iloilo (maps.app.goo.gl).\n\nNote: Due to weather conditions, departure/arrival ports may change. It is your responsibility to research before you go.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Guimaras", "question": "Do NOT visit/stay at Guimaras Island if you have a flight to catch the next day.", "answer": "Ferry schedules change regularly. Especially after the holidays, you may not be able to catch the ferry back due to high passenger volume.\n\nPlease plan accordingly and understand you are risking not making the ferry back to the mainland.\n\nWARNING: Plan to return to mainland at least one(1) day prior to your scheduled flight/departure.\n\nIf you are stranded because you cannot take the roro ferry back to the mainland, you will miss your flight.\n\nIf you abandon your rental at Guimaras, you will be subject to towing charges from Guimaras to our office in addition to cost for another day of rental for loss of use.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Guimaras", "question": "Should I visit Guimaras Island?", "answer": "Yes. Guimaras is known as the Mango capital of the Philippines and boast one of the best paved roads in the Western Visayas for riding.\n\nTour the mango farms, island coves, nature reserves and resorts.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Concepcion", "question": "Can I ride my rental to Concepcion?", "answer": "Yes. Plenty of our customers do. Concepcion is known for its island boat tours.\n\nStart your rental from Ilonggo Scooter Rental - Iloilo Branch (maps.app.goo.gl), then take three (3) hours scenic ride to Concepcion Boat Tours (maps.app.goo.gl).\n\nThere is no connecting land crossing to the islands. So you will park your rental and join the island tours at the wharf.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Concepcion", "question": "How long should I rent a motorcycle to visit Concepcion?", "answer": "We recommend a minimum three(3) days itinerary:\n\nDay 1 - Ride from Iloilo to Concepcion. Stay the night in Pan De Azucar Hotel.\n\nDay 2 - Walk to the ferry terminal and join the island tours at 7am (ask for \"Joiners\" Island Tour). Stay the night at Pan De Azucar Hotel.\n\nDay 3 - Get breakfast, then take a leisurely coastal ride back to Iloilo City.\n\nDo NOT plan on visiting Concepcion if you do not have three(3) days to spare prior to your flight out of Iloilo City.\n\nContact us if you need more information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Gigantes", "question": "Can I ride my rental to Gigantes Island?", "answer": "Yes. Plenty of our customers do. Gigantes is known for its island boat tours off Bancal Wharf.\n\nStart your rental from Ilonggo Scooter Rental - Iloilo Branch (maps.app.goo.gl), then take five (5) hours leisurely scenic ride to Bancal Wharf - Carles (maps.app.goo.gl).\n\nThere is no connecting land crossing to Gigantes. So you will park your rental at the ferry terminal and join the island tours at the wharf.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Gigantes", "question": "How long should I rent a motorcycle to visit Gigantes?", "answer": "We recommend a minimum three (3) days itinerary:\n\nDay 1 - Ride from Iloilo to Carles. Stay the night in Carles.\n\nDay 2 - Join the island tours at 7am (ask for \"Joiners\" Island Tour). Stay the night at Solina Resort.\n\nDay 3 - Get breakfast, then take a leisurely coastal ride back to Iloilo City.\n\nDo NOT plan on visiting Gigantes if you do not have three (3) days to spare prior to your flight out of Iloilo City.\n\nContact us if you need more information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Boracay", "question": "Can I ride my rental to Boracay?", "answer": "Yes. Plenty of our customers do.\n\nStart your rental from Ilonggo Scooter Rental - Iloilo Branch (maps.app.goo.gl), then take five(5) hours scenic ride to Caticlan Ferry Terminal (maps.app.goo.gl).\n\nHowever, please note that motorized vehicles are not allowed on Boracay Island.\n\nUnless you are a resident of Boracay Island, you will just park your rental at the ferry terminal and take a ferry to Boracay Island.\n\nThere are electric mini-buses for you to get around Boracay.\n\nYou can loan \"bus cards\" from us (subject to availability) for free to ride buses on Boracay.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Boracay", "question": "How long should I rent a motorcycle to visit Boracay?", "answer": "We recommend a minimum five (5) days itinerary:\n\nDay 1 - Ride from Iloilo to Ibajay. Stay the night in Jamins Hotel.\n\nDay 2 - Take a short ride from Ibajay to Caticlan Port, park your rental, and take the ferry to Boracay.\n\nDay 2 to 4: Stay in Boracay Island. Go for snorkeling tours and water sports. Enjoy the beach, bars and stunning blue waters.\n\nRecommended Boracay Hotels: Mandarin Nest, Aqua Boracay, Savoy Hotel and Belmont Hotel\n\nDay 5 - Get breakfast, take the early ferry back to Caticlan, then ride back to Iloilo City.\n\nDo NOT plan on visiting Boracay if you do not have five (5) days to spare prior to your flight out of Iloilo City.\n\nContact us if you need more information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Lakawon", "question": "Can I ride my rental to Lakawon?", "answer": "Yes. Start your rental from Ilonggo Scooter Rental, then take a one(1) hour scenic ride to Lakawon Ticketing Office - Cadiz Viejo (maps.app.goo.gl).\n\nThere is no connecting land crossing to the islands. So you will park your rental and take a boat at the wharf.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Regional Destinations", "section": "Visit Lakawon", "question": "How long should I rent a motorcycle to visit Lakawon?", "answer": "We recommend a minimum three (3) days itinerary:\n\nDay 1 - Start your rental from our Ilonggo Scooter Rental at 3pm.\n\nDay 2 - Depart at 7.30am from Bacolod City to Cadiz Viejo to catch the 9am ferry to Lakawon Island. Stay the night at Lakawon Resort.\n\nDay 3 - Get breakfast, take the ferry back to Cadiz Viejo and leisurely ride back to Bacolod City.\n\nDo NOT plan on visiting Lakawon if you do not have three(3) days to spare prior to your flight out of Bacolod City.\n\nIf weather gets bad, you will be stranded in Lakawon Island.\n\nContact us if you need more information.", "url": "https://www.ilonggo.fun/faq"}, {"category": "Home", "section": "Ride Iloilo", "question": "Ride Iloilo", "answer": "Ilonggo Scooter Rental is a fully licensed and registered motorcycle rental company in the Philippines.\n\nWe love exploring Southeast Asia on two wheels, and we started Ilonggo Scooter Rental to offer the awesome service we always wished we had on our trips.\n\nWe want every traveler to experience the joy of riding on a clean, safe, and reliable motorcycle in the Philippines.\n\nIf you found us here - we hope to meet you soon!", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Why Settle For Less?", "question": "Why Settle For Less?", "answer": "- FREE Navigational Route Map\n\n- FREE Audio Narration for Landmarks\n\n- FREE Digital Sight-Seeing Map\n\n- FREE Expatriate Guides\n\n- LEGITIMATE Motorcycle Rental Company\n\n- LICENSED Motorcycle Rental Fleet\n\n- CREDIT CARD Payments Accepted\n\n- STREET-LEGAL Helmets At No Charge\n\n- CLEAN Handwashed Helmets\n\n- SERVICING Records Upon Request\n\n- INSURANCE Add-On Options\n\n- US Payments Via Zelle\n\n- SG Payments Via PayNow\n\n- PH Payments Via GCash", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Rider Safety", "question": "Rider Safety", "answer": "SPOT THE RED FLAGS\n\nLicensed providers must follow government inspections and fleet maintenance rules, whereas private individuals cannot legally rent out personal vehicles without proper permits. Because unlicensed operators lack regulatory oversight, informal rentals carry higher risks of mechanical failures, worn brakes or bald tires, as well as fines, voided insurance, and sudden vacation disruptions from vehicle impoundment.\n\nFor your safety, walk away if rental operator:\n\n- 5-star ratings come mostly from accounts with only one review.\n\n- Fails to display official business permits.\n\n- Unable to provide proof of DTI and Business Registration.\n\n- Cannot show you valid vehicle registration and proof of insurance.\n\n- Cannot provide a formal rental contract.\n\n- Cannot provide street-legal helmets.\n\n- Does not transparently display prices in store or online.\n\n- Advertise a low rate, then charges you hidden fees.\n\n- Advertise a low rate, then claim its no longer available.\n\n- Promotes a deceptive lower daily rate, that turns out to be for daytime 8hr use, and not the standard 24 hours/day.", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Self-Guided Tours", "question": "Self-Guided Tours", "answer": "Explore Like A Local. Discover The Beauty & Charm of Iloilo At Your Own Pace.\n\nExplore historic landmarks, scenic waterfront, or vibrant culture, with our self-guided audio tours.", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Satisfaction Guarantee", "question": "Satisfaction Guarantee", "answer": "NOT SATISFIED? Swap Your Ride or Get Refund\n\nTo Avoid Abuse:\n\n1. This Offer Is For New Customers Only\n\n2. Return With The Same Fuel Level At Checkout\n\n3. Return Within 1 Hour Of Your Rental\n\n4. You Need To Have A Motorcycle License\n\n5. All Contract Terms Shall Apply", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Motorcycle Rental Rates", "question": "Motorcycle Rental Rates — 155cc Yamaha Lexi", "answer": "MOUNTAIN EXPLORER\n\n1 - 6 days: 750 PHP/Day\n\n7 - 29 days: 650 PHP/Day\n\n30 days & more: 475 PHP/Day\n\n- Equivalent to NMAX or ADV\n\n- Mid-Sized Frame & Seat\n\n- Medium-Stretch Leg Room\n\n- Superior Climbing Power\n\n- 14-inch Wheels\n\n- 12.8 L Underseat Storage\n\n- 4.2 L Fuel Tank Capacity", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Motorcycle Rental Rates", "question": "Motorcycle Rental Rates — 125cc Suzuki Burgman", "answer": "COUCH ON WHEELS\n\n1 - 6 days: 600 PHP/Day\n\n7 - 29 days: 500 PHP/Day\n\n30 days & more: 365 PHP/Day\n\n- Similar to NMAX or PCX\n\n- Wide Frame & Plush Seat\n\n- Full-Stretch Leg Room\n\n- Average Climbing Power\n\n- 12-inch Wheels\n\n- 21.5 L Underseat Storage\n\n- 5.6 L Fuel Tank Capacity", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Motorcycle Rental Rates", "question": "Motorcycle Rental Rates — 125cc Honda Click", "answer": "BEST CITY BIKE\n\n1 - 6 days: 600 PHP/Day\n\n7 - 29 days: 500 PHP/Day\n\n30 days & more: 365 PHP/Day\n\n- Nimble & Fuel-Efficient\n\n- Narrow Frame & Seat\n\n- Flat Foot Rest\n\n- Good Climbing Power\n\n- 14-inch Wheels\n\n- 18 L Underseat Storage\n\n- 5.5 L Fuel Tank Capacity", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Included with Rental", "question": "Included with Rental", "answer": "- Two (2) Clean Helmets (Rider Helmet Hand-Washed; Pillion Helmet Wiped Clean)\n\n- 3rd Party Liability Insurance\n\n- Vehicle Registration\n\n- Phone Holder/Charger\n\n- FREE Navigation Route Map\n\n- FREE Audio Guides\n\n- FREE Travel & Expat Guides\n\n- Absorptive Towel & Wrench", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Optional Add-Ons", "question": "Optional Add-Ons", "answer": "- Motorcycle Saddle Bag\n\n- Motorcycle Top Box\n\n- Motorcycle Dust/Rain Cover\n\n- Personal/Vehicle Insurance\n\n- PVC Rain Coat\n\n- Luggage Storage\n\n- Reflective Vest", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Payment Options", "question": "Payment Options", "answer": "We accept Cash, Credit Card, PayPal, GCash, Zelle, PayNow and Wise.\n\n— and more. See our FAQ for the full list of accepted payment methods.", "url": "https://www.ilonggo.fun/"}, {"category": "Home", "section": "Our Location", "question": "Our Location", "answer": "Store Hours: 9 am to 6pm (PH Time)\n\nCall (+63) 995-119-4705", "url": "https://www.ilonggo.fun/"}, {"category": "Reservations", "section": "Reservations", "question": "Reservations", "answer": "WhatsApp / Facebook\n\n(+63) 995-119-4705\n\nGRAB to ISR Office\n\nInstruct Your Taxi Driver: \"Go to One Spatial\"\n\nR.Mapa St, Mandurriao", "url": "https://www.ilonggo.fun/reservations"}, {"category": "Iloilo Guides", "section": "Digital Map & Audio", "question": "Digital Map & Audio", "answer": "Under your motorcycle underseat compartment, look for white card labelled with ISR Logo.\n\n- Internet Data Is Required For Digital Access\n\n- iOS (iPhone): Scan QR Code to open web browser\n\n- Android: Scan QR Code or Tap Card\n\n- Download Google Maps to access your route map\n\n- See \"Offline Resource\" for an alternative\n\nNote: If you do not have a card under your underseat compartment, that means you have not rented from Ilonggo Scooter Rental (ISR). Feel free to use our free \"Offline Resource\" below.", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Iloilo Guides", "section": "Riding Videos", "question": "Riding Videos", "answer": "Caution:\n\n- Steep incline, narrow & unpaved and slippery terrain.\n\n- No insurance will extend coverage if you choose to go.\n\nCheck Prior To Departure:\n\n- Weather Advisories\n\n- Road Closures\n\n- Mudslide Warnings\n\nCaution:\n\nTo avoid getting stranded on the island, do not plan on taking the last ferry back.\n\nCheck Prior To Departure:\n\n- Ferry schedule\n\n- Weather forecast\n\n- High Demand Due To Events\n\nAdvisory:\n\n- Island tours do not provide snorkeling gear.\n\n- You may rent snorkel gear from ISR, if available.", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Iloilo Guides", "section": "Grocers & Markets", "question": "Grocers & Markets", "answer": "- S&R is a warehouse club to get imported food items, meat and fresh lettuce.\n\n- Plazuela farmer's market is a good resource of local fruits and vegetables.\n\n- Iloilo Fish Port is a wet market for seafood in Iloilo City.\n\n- Lapaz wet market is where locals get their produce and meats.\n\nClick Below For Locations on Google Maps.", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Iloilo Guides", "section": "Festivals", "question": "Festivals", "answer": "Notes:\n\n1. This list is only intended to serve as a starting point for your research.\n\n2. Locations and dates of events may vary from year to year.\n\n3. For up-to-date information, please refer to the state-sponsored events calendar below.\n\n- Ati-Atihan Festival (Aklan): Celebrated in Kalibo, Aklan, held on the 3rd Sunday on January, this festival is a vibrant and lively celebration in honor of the Santo Niño, with street dancing and colorful costumes mimicking the Ati people. The Ati-Atihan is considered the \"mother of all Philippine festivals\".\n\n- Dinagyang Festival (Iloilo City): Held in Iloilo City 4th Sunday on January, the Dinagyang is a grand celebration with street dancing, elaborate costumes, and music, commemorating the pact between the Malay settlers and the indigenous Ati people and honoring the Santo Niño.\n\n- Paraw Regatta Festival (Iloilo City): Celebrated in February, this festival features colorful and elaborate paraw sailboats (traditional fishing boats) competing in races.\n\n- Binirayan Festival (Antique): This festival, held in March in Antique, celebrates the town's history and culture.\n\n- Manggahan Festival (Guimaras): Held in April or May, this festival showcases the agricultural bounty of Guimaras, especially mangoes. This festival commemorates the start of Mango season in Panay.\n\n- Tapayan Festival (Dao, Capiz): Held in April, this festival is a unique celebration featuring a giant clay pot (tapayan) as the centerpiece.\n\n- CAPIZtahan (Capiz): A cultural and food festival, founding anniversary, and memorial celebration held in Capiz every April 15th.\n\n- Halaran Festival (Capiz): Held in December in Capiz, celebrates the province's history and culture.", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Iloilo Guides", "section": "Offline Resource", "question": "Offline Resource", "answer": "Screenshot the map below for offline use with Google Maps", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Iloilo Guides", "section": "Leave Us a Review", "question": "Leave Us a Review", "answer": "If you enjoyed this FREE guide, please leave us a review.", "url": "https://www.ilonggo.fun/iloilo-guides"}, {"category": "Expat Resource", "section": "Disclaimers", "question": "Disclaimers", "answer": "- This guide is intended to serve as a starting point for your research.\n\n- We are not affiliated with any third-party businesses listed here.\n\n- We are not paid for any third-party referrals from this guide.\n\n- This guide is not meant to be comprehensive.\n\n- Please conduct your own due diligence.", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Emergency Hotline", "question": "Emergency Hotline", "answer": "Iloilo Police Department: 033-321-2355 (Mandurriao, Iloilo City), 033-337-9502 (Molo, Iloilo City)\nIloilo Fire Department: 033-337-3011 (City Proper, Iloilo City), 033-321-0779 (Mandurriao, Iloilo City), 033-337-6283 (Molo, Iloilo City)\nIloilo Emergency Responders: 033-335-1554", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Common Mistakes", "question": "Common Mistakes", "answer": "- Before making payments for any goods/services, ensure the company is legally registered with BIR and DTI. Otherwise, there will be NO recourse if a transaction goes wrong.\n\n- Most goods and services in the Philippines are paid for with cash. Credit cards are NOT widely accepted.\n\n- Do NOT purchase housing, vehicle, furniture, etc while you are still on tourist visa.\n\n- While dating, educate yourself on cohabitation laws in the Philippines.\n\n- Get health insurance that at a minimum cover imaging, blood work and consultations.\n\n- It would be wise to delegate a competent healthcare surrogate to act in your interest, if you are debilitated.\n\n- Before purchasing a vehicle, understand the registration timelines (up to 3 months) before you can drive/ride.\n\n- For US residents, port your US number to Google Voice to call or receive calls from friends and family for free.\n\n- For US residents, prior to moving here, get a debit card from Fidelity or Schwab for No Fee ATM withdrawals.\n\n- Have a local emergency contact to act as a liaison to friends and family back home.", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Condominium Rental", "question": "Condominium Rental", "answer": "Iloilo Condo Locations · RentScout PH", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Motorcycle Rental", "question": "Motorcycle Rental", "answer": "Contact Us · Map Location", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Legal Matters", "question": "Legal Matters", "answer": "Common-Law Marriage · File Consumer Complaint · Immigration Services", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Government Offices", "question": "Government Offices", "answer": "If you qualify, skip the physical queue and just use the government e-services link below to process your Tourist Visa Extensions, ACR Annual Reporting, Emigration Clearance or Visa Waivers.\n\nLinks: e-Services Immigration · Driver's License · Bureau of Immigration · NBI Clearance · BIR e-Complaint", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Medical Options", "question": "Medical Options", "answer": "Maxicare (HMO Plan) · Maxicare Location · Medicard (PPO Plan) · Medicard Location · HealthWay (Basic HMO Plan) · Healthway Location · Medicus (Basic HMO Plan) · Medicus Location · Emergency Prepaid Card · Other HMOs", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Groceries", "question": "Groceries", "answer": "Grocery Locations · S&R Membership", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Mobile Provider", "question": "Mobile Provider", "answer": "GOMO (MVNO for Globe)", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Internet Provider", "question": "Internet Provider", "answer": "Converge", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Flight Deals", "question": "Flight Deals", "answer": "Cebu Pacific Pass · AirAsia Move Pass", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Shopping", "question": "Shopping", "answer": "Decathlon Sports · Citi Hardware · Ace Hardware · Furniture & Appliances", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Online Shopping", "question": "Online Shopping", "answer": "Amazon (Philippines) · TEMU (Philippines) · Vitamins & Supplements · Cooking Spices", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Printing Services", "question": "Printing Services", "answer": "Papermints Location", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Festivals & Events", "question": "Festivals & Events", "answer": "Events Calendar", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Co-Working Space", "question": "Co-Working Space", "answer": "Regus Location (Premium) · Work Lounge (Affordable)", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Sports & Fitness", "question": "Sports & Fitness", "answer": "Facebook Run Group · Reclub Sports Group · Rock Climbing · Swimming · Pilates and Judo · Gym Membership", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Banking Services", "question": "Banking Services", "answer": "Open a savings account at an expat-friendly local bank and transfer funds from your home bank to your Philippines Bank. Alternatively, use money transfer section below to open a wise online account to save on transfers. Caution: Wise has limited customer support. Do not retain excessive funds in your wise account.\n\nHow do I avoid the hefty ATM transaction fees while in the Philippines?\n\nUnfortunately, there is no one solution that fits everyone.\n\nThe best approach is to open a Philippines Bank account, if you qualify.\n\nOr get a debit card from your home country that reimburse ATM fee for withdrawals.\n\nOther transfer methods used by foreigners:\n\n(a) Your Bank from Home > Wise > Your Philippines Bank > No ATM fee withdrawals\n\n(b) Your Bank from Home > Revolut > Your Philippines Bank > No ATM fee withdrawals\n\nNote: Direct bank-to-bank wire transfers are expensive and takes 3 to 5 days to process.\n\nClick HERE for links to open accounts with Wise, Revolut or PayPal.\n\nCan I open a bank account in the Philippines?\n\nUnfortunately, there is no one solution that fits everyone.\n\nWe can provide you the guidance you need to get a local banking account in your name so you can transfer funds from your home country to your account in the Philippines, without relying on anyone.\n\nContact Us for more information and consultation fees.\n\nLinks: Wise · Revolut · Security Bank Location · Contact Us", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Best Debit Cards", "question": "Best Debit Cards", "answer": "If available in your country of origin, the debit cards listed below offer ATM fee reimbursements!\n\nLinks: Schwab (US Only) · Fidelity (US Only) · Crypto.com (Global)", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Money Transfers", "question": "Money Transfers", "answer": "You may use any of the services below to open a online account to transfer funds to yourself / others and save on fees. Caution: e-Banking solutions listed have limited customer support. Do not retain excessive funds in your account.\n\nLinks: Wise (Free Debit Card) · PayPal ($10 Sign-Up Bonus) · Revolut · Zelle (US Only)", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Laundry Services", "question": "Laundry Services", "answer": "Laundry Locations", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Water Delivery", "question": "Water Delivery", "answer": "You do not have to buy and haul water from the grocers. There are assigned water vendors that deliver drinking water in 20 gallon jerry cans for your neighborhood or condominium. Speak to your condominium agent, management team or neighbors for more information.", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Property Purchase", "question": "Property Purchase", "answer": "For condominiums, have an attorney vet your purchase contract BEFORE payment.\n\nFor vehicles, while it may appear cheaper to buy a ‘used’ or ‘repossessed’, the cost savings are NOT worth all the hassle and pitfalls associated with transfer ownership.\n\nIf you buy a new vehicle, expect to wait before you can use your vehicle. Your vehicle license plate and ORCR may not be ready for weeks. Your wait duration is highly dependent on your dealership of choice.\n\nLinks: Building & Occupancy Permit", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Property Tax", "question": "Property Tax", "answer": "Real Estate Tax Portal", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Travel Insurance", "question": "Travel Insurance", "answer": "SquareMouth · World Nomads · US Residents Only · For Australians Only", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Sports Channels", "question": "Sports Channels", "answer": "Soccer - EPL & La Liga · Soccer - Cup Tournaments · NBA Basketball · NFL Football", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Pet Adoption", "question": "Pet Adoption", "answer": "Iloilo Animal Shelter", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Business Permit", "question": "Business Permit", "answer": "Business Permit Portal", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Still Need Help?", "question": "Still Need Help?", "answer": "Call us at (+63) 995-119-4705 if you need personalized experience for a fee.\n\nIf you use the services listed, do let them know you were referred by iLonggo. This ensures accountability and a consistent level of service for everyone in our community.\n\nLastly, if you find this free resource helpful, we would greatly appreciate your review.", "url": "https://www.ilonggo.fun/expat-resource"}, {"category": "Expat Resource", "section": "Please Review Us", "question": "Please Review Us", "answer": "Leave Us A Review · Contact Us", "url": "https://www.ilonggo.fun/expat-resource"}];

(function(){
  "use strict";

  var CATEGORIES = [];
  var catCounts = {};
  FAQ_DATA.forEach(function(e){
    if (catCounts[e.category] === undefined){ catCounts[e.category] = 0; CATEGORIES.push(e.category); }
    catCounts[e.category]++;
  });
  var PAGE_SIZE = 40;
  var FAQ_URL = "https://www.ilonggo.fun/faq";

  // Pre-compute lowercase haystacks once.
  var INDEX = FAQ_DATA.map(function(e, i){
    return {
      i:i, category:e.category, section:e.section, question:e.question, answer:e.answer, url:e.url,
      hay:(e.category + " \n " + e.section + " \n " + e.question + " \n " + e.answer).toLowerCase(),
      qLow:e.question.toLowerCase(),
      aLow:e.answer.toLowerCase(),
      scLow:(e.section + " " + e.category).toLowerCase()
    };
  });

  var state = { query:"", tokens:[], filter:"all", results:[], shown:0 };

  var el = {
    q: document.getElementById("q"),
    form: document.getElementById("search-form"),
    clear: document.getElementById("clear-btn"),
    meta: document.getElementById("meta"),
    results: document.getElementById("results"),
    none: document.getElementById("no-results"),
    moreRow: document.getElementById("more-row"),
    moreBtn: document.getElementById("more-btn")
  };

  /* ---------- helpers ---------- */
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(ch){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch];
    });
  }
  function escapeRegExp(str){
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  function tokenize(query){
    var seen = {}, out = [];
    query.toLowerCase().split(/[\s,;]+/).forEach(function(raw){
      var tok = raw.replace(/^[^a-z0-9]+|[^a-z0-9.]+$/gi, "");
      if (tok && /[a-z0-9]/.test(tok) && !seen[tok]) { seen[tok] = true; out.push(tok); }
    });
    return out;
  }
  function highlightEscaped(escaped, tokens){
    if (!tokens.length) return escaped;
    var sorted = tokens.slice().sort(function(a,b){ return b.length - a.length; });
    var pattern = sorted.map(escapeRegExp).join("|");
    var re = new RegExp("(" + pattern + ")", "gi");
    return escaped.replace(re, "<mark>$1</mark>");
  }
  function renderRich(text, tokens){
    // Escape, linkify literal URLs, highlight matches outside the links.
    var esc = escapeHtml(text);
    var parts = esc.split(/(https?:\/\/[^\s)]+|www\.[^\s)]+)/g);
    for (var i = 1; i < parts.length; i += 2){
      var u = parts[i];
      var href = u.indexOf("http") === 0 ? u : "https://" + u;
      parts[i] = '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + u + "</a>";
    }
    for (var j = 0; j < parts.length; j += 2){
      parts[j] = highlightEscaped(parts[j], tokens);
    }
    return parts.join("");
  }
  function renderAnswer(text, tokens){
    return text.split(/\n\n+/).map(function(p){
      return "<p>" + renderRich(p, tokens) + "</p>";
    }).join("");
  }
  function countOccurrences(haystack, token){
    var n = 0, idx = 0;
    while (true){
      idx = haystack.indexOf(token, idx);
      if (idx === -1) break;
      n++; idx += Math.max(token.length, 1);
      if (n > 20) break;
    }
    return n;
  }

  /* ---------- search ---------- */
  function runSearch(scroll){
    var query = el.q.value.trim();
    state.query = query;
    state.tokens = tokenize(query);
    el.clear.classList.toggle("show", query.length > 0);

    if (!query && state.filter === "all"){
      state.results = [];
      state.shown = 0;
      el.results.innerHTML = "";
      el.meta.innerHTML = "";
      el.moreRow.classList.add("hidden");
      el.none.classList.add("hidden");
      return;
    }

    var tokens = state.tokens;
    var scored = [];
    for (var j = 0; j < INDEX.length; j++){
      var e = INDEX[j];
      if (state.filter !== "all" && e.category !== state.filter) continue;
      if (!tokens.length){
        scored.push({ e:e, matched:0, score:0, all:true });
        continue;
      }
      var matched = 0, score = 0;
      for (var k = 0; k < tokens.length; k++){
        var tok = tokens[k];
        var inQ = countOccurrences(e.qLow, tok);
        var inA = countOccurrences(e.aLow, tok);
        var inS = countOccurrences(e.scLow, tok);
        if (inQ + inA + inS > 0){
          matched++;
          score += inQ * 3 + inA * 2 + inS * 3;
          if (inQ > 0 && inA > 0) score += 2;
        }
      }
      if (matched === 0) continue;
      if (tokens.length > 1 && e.hay.indexOf(query.toLowerCase()) !== -1) score += 25;
      scored.push({ e:e, matched:matched, score:score, all: matched === tokens.length });
    }
    if (tokens.length){
      scored.sort(function(a,b){
        if (a.all !== b.all) return a.all ? -1 : 1;
        if (a.matched !== b.matched) return b.matched - a.matched;
        if (a.score !== b.score) return b.score - a.score;
        return a.e.i - b.e.i;
      });
    }

    state.results = scored;
    state.shown = Math.min(PAGE_SIZE, scored.length);
    render(scroll);
  }

  function render(scroll){
    var total = state.results.length;

    if (total === 0){
      el.results.innerHTML = "";
      el.meta.innerHTML = "";
      el.moreRow.classList.add("hidden");
      var filterNote = "";
      var tryFilters = " &mdash; try";
      document.getElementById("no-results-text").innerHTML =
        "Nothing in the FAQ matches <strong>&ldquo;" + escapeHtml(state.query) + "&rdquo;</strong>" + filterNote + tryFilters +
        " fewer words, a shorter term (for example just &ldquo;insurance&rdquo; or &ldquo;fuel&rdquo;), or check the spelling.";
      el.none.classList.remove("hidden");
      return;
    }
    el.none.classList.add("hidden");

    var detail;
    if (!state.query){
      detail = "browsing the <strong>" + escapeHtml(state.filter) + "</strong> category";
    } else {
      var allCount = state.results.filter(function(r){ return r.all; }).length;
      detail = "for &ldquo;" + escapeHtml(state.query) + "&rdquo;";
      if (state.filter !== "all") detail += " in " + escapeHtml(state.filter);
      if (state.tokens.length > 1) detail += " &middot; " + allCount.toLocaleString() + " match" + (allCount === 1 ? "es" : "") + " all " + state.tokens.length + " words";
    }
    if (total > state.shown) detail += " &middot; showing first " + state.shown.toLocaleString();
    el.meta.innerHTML = '<span class="count">' + total.toLocaleString() + " result" + (total === 1 ? "" : "s") + '</span><span class="detail">' + detail + "</span>";

    var html = "";
    for (var i = 0; i < state.shown; i++){
      var e = state.results[i].e;
      html += '<article class="card">' +
        '<div class="card-top"><span class="badge"><span class="dot" aria-hidden="true"></span>' + escapeHtml(e.category) + '</span>' +
        '<span class="section-name">' + escapeHtml(e.section) + "</span></div>" +
        '<p class="question">' + highlightEscaped(escapeHtml(e.question), state.tokens) + "</p>" +
        '<div class="answer">' + renderAnswer(e.answer, state.tokens) + "</div>" +
        '<div class="card-foot"><a href="' + (e.url || FAQ_URL) + '" target="_blank" rel="noopener noreferrer">' + (e.url && e.url !== FAQ_URL ? "View on the " + escapeHtml(e.category) + " page" : "View on the FAQ page") + ' <span aria-hidden="true">&#8599;</span></a></div>' +
        "</article>";
    }
    el.results.innerHTML = html;
    el.moreRow.classList.toggle("hidden", state.shown >= total);
    if (state.shown < total){
      el.moreBtn.textContent = "Show more results (" + (total - state.shown).toLocaleString() + " remaining)";
    }
    if (scroll){
      el.meta.scrollIntoView({ block:"start", behavior:"smooth" });
    }
  }

  el.moreBtn.addEventListener("click", function(){
    state.shown = Math.min(state.shown + PAGE_SIZE, state.results.length);
    render(false);
  });

  /* Live search as the user types (debounced), plus explicit submit. */
  var debounce = null;
  el.q.addEventListener("input", function(){
    clearTimeout(debounce);
    debounce = setTimeout(function(){ state.filter = "all"; runSearch(false); }, 180);
  });
  el.form.addEventListener("submit", function(ev){
    ev.preventDefault();
    clearTimeout(debounce);
    state.filter = "all";
    runSearch(true);
  });
  el.clear.addEventListener("click", function(){
    el.q.value = "";
    state.filter = "all";
    runSearch(false);
    el.q.focus();
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "/" && document.activeElement !== el.q && !/input|textarea|select/i.test(document.activeElement.tagName)){
      ev.preventDefault();
      el.q.focus();
    }
  });

  runSearch(false);
})();
</script>
</body>
</html>
